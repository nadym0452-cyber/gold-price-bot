name: Log Gold Price

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python price_logger.py
      - name: Commit history
        run: |
          git config user.name "gold-bot"
          git config user.email "bot@example.com"
          git add price_history.json
          git commit -m "update price history" || echo "no changes"
          git push
